# Production default: host nginx (certbot) owns 80/443; api/web bind localhost only.
# Install config from infra/nginx/host-nginx.conf.example → /etc/nginx/sites-available/erp
#
#   docker compose \
#     -f infra/docker/docker-compose.yml \
#     -f infra/docker/docker-compose.prod.yml \
#     -f infra/docker/docker-compose.prod-host-nginx.yml \
#     up -d postgres redis minio api web
#
# Host nginx should proxy to 127.0.0.1:3000 (web) and 127.0.0.1:3001 (api) per infra/nginx/nginx.conf paths.

services:
  api:
    ports:
      - "127.0.0.1:3001:3001"

  web:
    ports:
      - "127.0.0.1:3000:3000"
