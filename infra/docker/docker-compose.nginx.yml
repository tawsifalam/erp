# Optional: nginx inside Docker (local all-in-docker demo only).
# Production uses host nginx — see infra/nginx/host-nginx.conf.example and cloud-deployment.md.
#
#   docker compose -f docker-compose.yml -f infra/docker/docker-compose.nginx.yml up -d

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - api
      - web
