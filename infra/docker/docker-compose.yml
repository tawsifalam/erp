services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: hospitality_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d hospitality_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        SOURCE_REV: ${SOURCE_REV:-unknown}
    env_file:
      - path: ../../.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://erp:erp@postgres:5432/hospitality_erp
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.one-venue.com}
      PROPELAUTH_AUTH_URL: ${PROPELAUTH_AUTH_URL:-https://3479393695.propelauthtest.com}
      PROPELAUTH_API_KEY: ${PROPELAUTH_API_KEY:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: erp-files
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        SOURCE_REV: ${SOURCE_REV:-unknown}
        # Rebuild web when these change (baked into Next.js). Loaded from repo root .env.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.one-venue.com}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-https://3479393695.propelauthtest.com}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.one-venue.com}
    env_file:
      - path: ../../.env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      - api
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  minio_data:
