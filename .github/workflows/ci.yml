name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/hospitality_erp
      PROPELAUTH_AUTH_URL: https://ci.example.propelauth.com
      PROPELAUTH_API_KEY: ci-test-api-key
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: hospitality_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @erp/config build
      - run: pnpm --filter @erp/types build
      - run: pnpm --filter @erp/utils build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec prisma migrate deploy
        working-directory: apps/api
      - run: RUN_INTEGRATION=1 pnpm --filter @erp/api test:integration
        env:
          RUN_INTEGRATION: "1"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @erp/config build
      - run: pnpm --filter @erp/types build
      - run: pnpm --filter @erp/utils build
      - run: pnpm --filter @erp/ui build
      - run: pnpm test:e2e:install
      - run: pnpm test:e2e -- --project=chromium
        env:
          CI: "true"
