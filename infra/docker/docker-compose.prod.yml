# Production overlay for VPS (Hetzner, etc.): do not publish Postgres/Redis/MinIO ports on the host.
# API/web/nginx reach them via Docker DNS (postgres, redis, minio).
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.prod.yml up -d
#
# Migrations (from repo on server):
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.prod.yml \
#     exec api npx prisma migrate deploy --schema=/app/apps/api/prisma/schema.prisma

# Compose merges port lists by default; !reset clears base publish rules from docker-compose.yml.
services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    ports: !reset []
